# Actualizaciones automaticas de dependencias. Agrupa los cambios menores y
# de parche en un solo PR por ecosistema para no llenar la lista de PR.
# Las versiones mayores (por ejemplo Spring Boot 4) llegan en PR aparte.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-menores:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      android-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /landing/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      landing-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    groups:
      acciones:
        patterns: ["*"]
