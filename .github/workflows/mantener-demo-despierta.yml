# Render (plan gratis) apaga el servicio tras unos 15 minutos sin trafico y
# Supabase (plan gratis) pausa el proyecto si pasa dias sin consultas. Este
# workflow llama al API cada 10 minutos para que la demo responda al primer
# toque.
#
# - /api/health despierta Render (no toca la base).
# - /api/categories hace un SELECT de solo lectura y mantiene activa la base.
#   No se usa /api/tasks porque esa ruta escribe en cada lectura.
#
# Notas:
# - GitHub puede retrasar los cron varios minutos y los desactiva tras 60 dias
#   sin actividad en el repo: revisar la pestana Actions antes de una demo.
# - Un servicio despierto todo el mes usa ~744 de las 750 h gratis de Render;
#   si la cuenta tiene otros servicios gratis, compartirian esas horas.
# - Para apuntar a otro entorno, definir la variable DEMO_API_BASE_URL en
#   Settings > Secrets and variables > Actions > Variables.
name: Mantener la demo despierta

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mantener-demo-despierta
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE_URL: ${{ vars.DEMO_API_BASE_URL || 'https://t4k4sh.onrender.com/api' }}
    steps:
      - name: Despertar Render
        run: >
          curl --fail --silent --show-error --max-time 120
          --retry 3 --retry-delay 15 --retry-all-errors
          "$API_BASE_URL/health"
      - name: Mantener activa la base
        run: >
          curl --fail --silent --show-error --max-time 60
          --retry 2 --retry-delay 10 --retry-all-errors
          --output /dev/null --write-out "categorias: HTTP %{http_code} en %{time_total}s\n"
          "$API_BASE_URL/categories"
