# Compila la app iOS y corre sus pruebas en un simulador. Necesita macOS, que
# GitHub ofrece sin costo en repos publicos. Corre solo cuando cambia ios/ o
# a mano desde la pestana Actions.
#
# La app nunca se compilo en Xcode: este workflow es informativo y no se exige
# en la proteccion de main hasta que pase al menos una vez.
name: iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar-y-probar:
    name: Compilar y probar (simulador)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Versiones
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
      - name: Elegir un simulador de iPhone disponible
        id: simulador
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys
          d=json.load(sys.stdin)["devices"]
          ios=[(k,v) for k,v in d.items() if "iOS" in k]
          ios.sort(key=lambda kv: kv[0])
          for runtime,devs in reversed(ios):
              phones=[x for x in devs if x["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break')
          echo "Simulador: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Compilar
        run: >
          xcodebuild build-for-testing
          -project T4KASH.xcodeproj
          -scheme T4KASH
          -destination "id=${{ steps.simulador.outputs.udid }}"
          CODE_SIGNING_ALLOWED=NO
      - name: Pruebas
        run: >
          xcodebuild test-without-building
          -project T4KASH.xcodeproj
          -scheme T4KASH
          -destination "id=${{ steps.simulador.outputs.udid }}"
          CODE_SIGNING_ALLOWED=NO
