# Compila y prueba backend, Android y landing en cada PR y en cada push a main.
# Cada parte corre solo si cambiaron sus archivos (o el propio workflow).
# iOS va aparte (ios.yml) porque necesita un runner macOS.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      android: ${{ steps.filtro.outputs.android }}
      landing: ${{ steps.filtro.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
      - id: filtro
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'database/**'
              - '.github/workflows/ci.yml'
            android:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
            landing:
              - 'landing/web/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (pruebas con PostgreSQL real)
    needs: cambios
    if: needs.cambios.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # mvnw no tiene permiso de ejecucion en el repo; por eso se llama con sh.
      # Testcontainers usa el Docker del runner: las pruebas de integracion no se omiten.
      - name: Compilar y probar
        run: sh mvnw -B -ntp verify
      - name: Guardar reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: backend/target/surefire-reports
          retention-days: 7

  android:
    name: Android (pruebas, lint y APK debug)
    needs: cambios
    if: needs.cambios.outputs.android == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas, lint y APK
        run: sh gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-android
          path: |
            mobile/app/build/reports
            mobile/app/build/test-results
          retention-days: 7

  landing:
    name: Landing (lint y build)
    needs: cambios
    if: needs.cambios.outputs.landing == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: landing/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Auditar dependencias de produccion
        run: npm audit --omit=dev --audit-level=high

  # Un solo check estable para exigir en la proteccion de main: pasa si los
  # trabajos que corrieron pasaron y los que no aplicaban se saltaron.
  resultado:
    name: CI completo
    if: always()
    needs: [backend, android, landing]
    runs-on: ubuntu-latest
    steps:
      - name: Revisar resultados
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for r in $RESULTADOS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "Hay un trabajo con resultado: $r"
              exit 1
            fi
          done
