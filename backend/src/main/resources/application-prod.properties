# Perfil de produccion (Render): SPRING_PROFILES_ACTIVE=prod.
# Solo contiene lo que cambia respecto de application.properties.

# Sin documentacion publica del API: el mapa completo de rutas no queda expuesto.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# DEBUG en produccion llena los logs y puede volcar datos de usuarios.
logging.level.com.t4kash.api=INFO

# No devolver detalles internos en los errores.
server.error.include-stacktrace=never
server.error.include-message=never
